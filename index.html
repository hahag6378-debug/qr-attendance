<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងវត្តមាន</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        #result { margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>📷 Scan ចុះវត្តមាន</h2>
    <input type="text" id="userName" placeholder="បញ្ចូលឈ្មោះ ឬ ID បុគ្គលិក...">
    
    <!-- ផ្ទាំងកាមេរ៉ាបង្ហាញនៅទីនេះ -->
    <div id="reader"></div>
    <div id="result"></div>
</div>

<script>
    const resultDiv = document.getElementById('result');

    // បើកកាមេរ៉ាភ្លាមៗពេលបើត Web
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
            const userName = document.getElementById('userName').value;
            if (!userName) {
                alert("សូមបញ្ចូលឈ្មោះ ឬ ID ជាមុនសិន!");
                return;
            }
            
            // ទាញយក GPS
            navigator.geolocation.getCurrentPosition((pos) => {
                sendCheckin(userName, pos.coords.latitude, pos.coords.longitude);
            }, (err) => {
                alert("សូមបើក GPS/Location លើទូរស័ព្ទរបស់អ្នក!");
            });
        },
        (errorMessage) => { /* scanning... */ }
    ).catch(err => {
        resultDiv.className = "error";
        resultDiv.innerText = "មិនអាចបើកកាមេរ៉ាបានទេ! សូម Allow Camera លើ Safari/Chrome។";
    });

    function sendCheckin(userName, lat, lng) {
        fetch('/api/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName, userLat: lat, userLng: lng })
        })
        .then(res => res.json())
        .then(data => {
            resultDiv.className = data.success ? "success" : "error";
            resultDiv.innerText = data.message;
        });
    }
</script>

</body>
</html>
