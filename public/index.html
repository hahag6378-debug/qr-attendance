<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ប្រព័ន្ធស្កេនវត្តមាន</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <!-- ប្រើ Library សម្រាប់ទាញយកជា PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif !important; }
        body { margin: 0; padding: 16px; background-color: #F2F2F7; color: #1C1C1E; display: flex; justify-content: center; }
        .ios-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .ios-header { text-align: center; }
        h2 { font-size: 22px; margin: 0 0 4px 0; }
        .ios-subtitle { font-size: 14px; color: #8E8E93; }
        
        .ios-group { background-color: #FFFFFF; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
        label.field-label { font-weight: 600; font-size: 13px; color: #8E8E93; display: block; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 16px; background-color: #F2F2F7; border: 1px solid transparent; border-radius: 12px; outline: none; }

        .ios-action-group { display: flex; gap: 12px; }
        .ios-action-option { flex: 1; position: relative; }
        .ios-action-option input[type="radio"] { position: absolute; opacity: 0; }
        .ios-action-option label { display: flex; flex-direction: column; align-items: center; background-color: #FFFFFF; padding: 16px 8px; border-radius: 16px; cursor: pointer; border: 2px solid transparent; font-weight: 600; font-size: 13px; }
        .ios-icon { font-size: 26px; margin-bottom: 6px; }
        .ios-action-option input[type="radio"]:checked + label { border-color: #007AFF; background-color: rgba(0, 122, 255, 0.06); color: #007AFF; }

        .scanner-wrapper { position: relative; width: 100%; min-height: 280px; background-color: #000; border-radius: 14px; overflow: hidden; }
        #reader { width: 100% !important; border: none !important; }

        #status { display: none; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; }
        .success { background-color: rgba(52, 199, 89, 0.12); color: #34C759; }
        .error { background-color: rgba(255, 59, 48, 0.12); color: #FF3B30; }
        .loading { background-color: rgba(0, 122, 255, 0.12); color: #007AFF; }

        /* ប៊ូតុងទាញយក PDF */
        .btn-download {
            background-color: #FF3B30;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-download:active { opacity: 0.8; }
    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-header">
        <h2>ចុះវត្តមានធ្វើការ</h2>
        <div class="ios-subtitle">សូមស្កេន QR Code ដើម្បីកត់ត្រា</div>
    </div>
    
    <div class="ios-group">
        <label class="field-label" for="userName">ឈ្មោះ ឬ ID បុគ្គលិក</label>
        <input type="text" id="userName" placeholder="បញ្ចូលឈ្មោះ ឬ ID...">
    </div>

    <div class="ios-action-group">
        <div class="ios-action-option">
            <input type="radio" name="actionType" value="Check-In" id="checkin" checked>
            <label for="checkin"><span class="ios-icon">👍</span>ចូល (Check-In)</label>
        </div>
        <div class="ios-action-option">
            <input type="radio" name="actionType" value="Check-Out" id="checkout">
            <label for="checkout"><span class="ios-icon">🏠</span>ចេញ (Check-Out)</label>
        </div>
    </div>

    <div class="ios-group" style="padding: 12px;">
        <label class="field-label">កាមេរ៉ាស្កេន</label>
        <div class="scanner-wrapper">
            <div id="reader"></div>
        </div>
    </div>

    <div id="status">
        <span id="status-icon">🔄</span>
        <span id="status-text"></span>
    </div>

    <!-- ប៊ូតុងទាញយក PDF -->
    <button onclick="downloadPDF()" class="btn-download">
        📄 ទាញយករបាយការណ៍ជា PDF
    </button>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");
    let isProcessing = false;

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        
        statusDiv.style.display = 'flex';
        statusText.innerText = msg;
        statusDiv.className = type;

        if (type === 'success') statusIcon.innerText = '✅';
        else if (type === 'error') statusIcon.innerText = '❌';
        else statusIcon.innerText = '🔄';
    }

    function sendData(userName, lat, lng, actionType, qrData) {
        showStatus("កំពុងផ្ទៀងផ្ទាត់ GPS និង QR Code...", 'loading');
        
        fetch('/api/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName, userLat: lat, userLng: lng, actionType, qrCodeData: qrData })
        })
        .then(res => res.json())
        .then(data => {
            showStatus(data.message, data.success ? 'success' : 'error');
            setTimeout(() => { isProcessing = false; }, 4000);
        })
        .catch(() => {
            showStatus("មានបញ្ហាតភ្ជាប់ទៅ Server!", 'error');
            setTimeout(() => { isProcessing = false; }, 4000);
        });
    }

    // មុខងារទាញយកទិន្នន័យជា File PDF
    function downloadPDF() {
        fetch('/api/export-data')
            .then(res => res.json())
            .then(data => {
                if (!data || data.length === 0) {
                    alert("មិនទាន់មានទិន្នន័យវត្តមានសម្រាប់ទាញយកទេ!");
                    return;
                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFontSize(16);
                doc.text("Attendance Report", 14, 15);
                doc.setFontSize(10);
                doc.text(`Generated Date: ${new Date().toLocaleString()}`, 14, 22);

                const tableColumn = ["ID", "Name / ID", "Action", "Distance", "Date Time"];
                const tableRows = [];

                data.forEach(item => {
                    const rowData = [
                        item.id,
                        item.userName,
                        item.actionType,
                        item.distance,
                        item.timestamp
                    ];
                    tableRows.push(rowData);
                });

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: 28,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 122, 255] }
                });

                doc.save(`Attendance_Report_${new Date().toISOString().slice(0,10)}.pdf`);
            })
            .catch(err => {
                alert("មានបញ្ហាក្នុងការបង្កើត File PDF!");
            });
    }

    const config = { 
        fps: 20, 
        qrbox: function(viewfinderWidth, viewfinderHeight) {
            let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            return {
                width: Math.floor(minEdge * 0.75),
                height: Math.floor(minEdge * 0.75)
            };
        },
        aspectRatio: 1.0
    };

    html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
            if (isProcessing) return;

            const userName = document.getElementById('userName').value;
            const actionType = document.querySelector('input[name="actionType"]:checked').value;

            if (!userName || !userName.trim()) {
                showStatus("សូមវាយឈ្មោះរបស់អ្នកមុននឹងស្កេន!", 'error');
                return;
            }

            isProcessing = true;
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        sendData(userName, pos.coords.latitude, pos.coords.longitude, actionType, decodedText);
                    },
                    (error) => {
                        showStatus("សូមបើក Location (GPS) លើទូរស័ព្ទរបស់អ្នក!", 'error');
                        setTimeout(() => { isProcessing = false; }, 4000);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                showStatus("ទូរស័ព្ទរបស់អ្នកមិនគាំទ្រ GPS ទេ!", 'error');
                setTimeout(() => { isProcessing = false; }, 4000);
            }
        },
        (errorMessage) => {}
    ).catch(err => {
        showStatus("មិនអាចបើកកាមេរ៉ាបានទេ! សូមពិនិត្យសិទ្ធិ (Permission)", 'error');
    });
</script>

</body>
</html>
