<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ប្រព័ន្ធស្កេនវត្តមាន</title>
    
    <!-- Import Font Kantumruy Pro ផ្លូវការ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', sans-serif !important;
        }

        :root {
            --ios-bg: #F2F2F7;
            --ios-card-bg: #FFFFFF;
            --ios-primary: #007AFF;
            --ios-success: #34C759;
            --ios-error: #FF3B30;
            --ios-text: #1C1C1E;
            --ios-text-sub: #8E8E93;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--ios-bg);
            color: var(--ios-text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .ios-container {
            width: 100%;
            max-width: 400px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ios-header {
            text-align: center;
            padding: 8px 0;
        }

        h2 { 
            font-weight: 700; 
            font-size: 22px; 
            margin: 0 0 4px 0;
        }

        .ios-subtitle {
            font-size: 14px;
            color: var(--ios-text-sub);
        }

        .ios-group {
            background-color: var(--ios-card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        label.field-label {
            font-weight: 600;
            font-size: 13px;
            color: var(--ios-text-sub);
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            background-color: #F2F2F7;
            border: 1px solid transparent;
            border-radius: 12px; 
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            background-color: #FFFFFF;
            border-color: var(--ios-primary);
        }

        /* Radio Buttons */
        .ios-action-group {
            display: flex;
            gap: 12px;
        }

        .ios-action-option {
            flex: 1;
            position: relative;
        }

        .ios-action-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .ios-action-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--ios-card-bg);
            padding: 16px 8px;
            border-radius: 16px;
            cursor: pointer;
            border: 2px solid transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            font-weight: 600;
            font-size: 13px;
            color: var(--ios-text);
        }

        .ios-icon {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .ios-action-option input[type="radio"]:checked + label {
            border-color: var(--ios-primary);
            background-color: rgba(0, 122, 255, 0.06);
            color: var(--ios-primary);
        }

        /* Scanner Box - កែសម្រួលមិនឱ្យរញ៉េរញ៉ៃ */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
        }

        #reader { 
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }

        /* លាក់ elements លើសរបស់ library */
        #reader__scan_region {
            background: transparent !important;
        }
        #reader__dashboard {
            display: none !important;
        }

        /* Status Container */
        #ios-status-container {
            min-height: 48px;
        }

        #status { 
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px; 
            border-radius: 12px; 
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .success { background-color: rgba(52, 199, 89, 0.12); color: var(--ios-success); }
        .error { background-color: rgba(255, 59, 48, 0.12); color: var(--ios-error); }
        .loading { background-color: rgba(0, 122, 255, 0.12); color: var(--ios-primary); }

    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-header">
        <h2>ចុះវត្តមានធ្វើការ</h2>
        <div class="ios-subtitle">សូមស្កេន QR Code ដើមី្បកត់ត្រា</div>
    </div>
    
    <div class="ios-group">
        <label class="field-label" for="userName">ឈ្មោះ ឬ ID បុគ្គលិក</label>
        <input type="text" id="userName" placeholder="បញ្ចូលឈ្មោះ ឬ ID...">
    </div>

    <div class="ios-action-group">
        <div class="ios-action-option">
            <input type="radio" name="actionType" value="Check-In" id="checkin" checked>
            <label for="checkin">
                <span class="ios-icon">👍</span>
                ចូល (Check-In)
            </label>
        </div>
        <div class="ios-action-option">
            <input type="radio" name="actionType" value="Check-Out" id="checkout">
            <label for="checkout">
                <span class="ios-icon">🏠</span>
                ចេញ (Check-Out)
            </label>
        </div>
    </div>

    <div class="ios-group" style="padding: 12px;">
        <label class="field-label">កាមេរ៉ាស្កេន</label>
        <div class="scanner-wrapper">
            <div id="reader"></div>
        </div>
    </div>

    <div id="ios-status-container">
        <div id="status">
            <span id="status-icon">🔄</span>
            <span id="status-text"></span>
        </div>
    </div>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        
        statusDiv.style.display = 'flex';
        statusText.innerText = msg;
        statusDiv.className = type;

        if (type === 'success') { statusIcon.innerText = '✅'; }
        else if (type === 'error') { statusIcon.innerText = '❌'; }
        else if (type === 'loading') { statusIcon.innerText = '🔄'; }
    }

    function sendCheckin(userName, lat, lng, actionType, qrData) {
        showStatus("កំពុងផ្ទៀងផ្ទាត់ទិន្នន័យ...", 'loading');
        
        fetch('/api/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userName: userName,
                userLat: lat,
                userLng: lng,
                actionType: actionType,
                qrCodeData: qrData
            })
        })
        .then(res => res.json())
        .then(data => {
            showStatus(data.message, data.success ? 'success' : 'error');
        })
        .catch(err => {
            showStatus("មានបញ្ហាតភ្ជាប់ទៅកាន់ Server!", 'error');
        });
    }

    // កំណត់ទំហំស្កេនឱ្យល្មម
    const config = { 
        fps: 10, 
        qrbox: { width: 200, height: 200 },
        aspectRatio: 1.0
    };

    html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
            const userName = document.getElementById('userName').value;
            const actionType = document.querySelector('input[name="actionType"]:checked').value;

            if (!userName || userName.trim() === "") {
                showStatus("សូមវាយឈ្មោះរបស់អ្នកមុននឹងស្កេន!", 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition((pos) => {
                sendCheckin(userName, pos.coords.latitude, pos.coords.longitude, actionType, decodedText);
            }, (err) => {
                showStatus("សូមបើក GPS/Location លើទូរស័ព្ទរបស់អ្នក!", 'error');
            });
        },
        () => {}
    );
</script>

</body>
</html>
