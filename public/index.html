<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ប្រព័ន្ធស្កេនវត្តមានទំនើប</title>
    
    <!-- Link ទៅហ្វុងអក្សរ SF Pro របស់ Apple -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap">
    <!-- Link ទៅហ្វុងខ្មែរ Kantumruy Pro ដើម្បីឱ្យអក្សរខ្មែរស្អាតស៊ីគ្នា -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Link ទៅ Library ស្កេន QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card-bg: rgba(255, 255, 255, 0.8);
            --ios-primary: #007AFF; /* ពណ៌ខៀវ iPhone */
            --ios-success: #34C759; /* ពណ៌បៃតង iPhone */
            --ios-error: #FF3B30;   /* ពណ៌ក្រហម iPhone */
            --ios-text: #000000;
            --ios-text-secondary: #8E8E93;
            --font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Kantumruy Pro', sans-serif;
        }

        body { 
            font-family: var(--font-family);
            margin: 0; 
            padding: 0; 
            background-color: var(--ios-bg);
            color: var(--ios-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .ios-container {
            width: 100%;
            max-width: 375px; /* ទំហំអេក្រង់ iPhone SE/8 */
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ផ្នែកក្បាល (Header) */
        .ios-header {
            text-align: center;
            padding: 10px 0;
        }

        h2 { 
            font-weight: 600; 
            font-size: 20px; 
            margin: 0;
            letter-spacing: -0.5px;
        }

        .ios-subtitle {
            font-size: 14px;
            color: var(--ios-text-secondary);
            margin-top: 5px;
        }

        /* ប្រអប់បញ្ចូលឈ្មោះ */
        .ios-group {
            background-color: var(--ios-card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        label {
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--ios-text-secondary);
            display: block;
            margin-bottom: 8px;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            background-color: rgba(239, 239, 244, 0.8);
            border: none;
            border-radius: 10px; 
            box-sizing: border-box; 
            font-family: var(--font-family);
            -webkit-appearance: none;
        }

        input[type="text"]::placeholder {
            color: #C7C7CC;
        }

        input[type="text"]:focus {
            outline: 2px solid var(--ios-primary);
        }

        /* ផ្នែកជ្រើសរើស Check-In/Out */
        .ios-action-group {
            display: flex;
            gap: 12px;
        }

        .ios-action-option {
            flex: 1;
            position: relative;
        }

        .ios-action-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .ios-action-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--ios-card-bg);
            padding: 20px;
            border-radius: 14px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.1s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            font-weight: 500;
            text-align: center;
            font-size: 14px;
            margin: 0;
            color: var(--ios-text);
        }

        .ios-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        /* ស្ទីលពេលជ្រើសរើស (iOS Primary Color) */
        .ios-action-option input[type="radio"]:checked + label {
            border-color: var(--ios-primary);
            background-color: rgba(0, 122, 255, 0.05);
            color: var(--ios-primary);
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.15);
        }

        .ios-action-option input[type="radio"]:checked + label .ios-icon {
            color: var(--ios-primary);
        }

        /* ផ្នែកស្កេន QR */
        #ios-reader-container {
            position: relative;
            background-color: #000;
            border-radius: 14px;
            overflow: hidden;
            width: 100%;
            padding-bottom: 100%; /* សមាមាត្រ 1:1 Square */
        }

        #reader { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ជ្រុងៗពណ៌ស Focus Box ដូច Apple QR Scanner */
        .ios-qr-focus-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 10;
        }

        .ios-focus-corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: #fff;
            border-style: solid;
        }

        .top-left { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 4px; }
        .top-right { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 4px; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 4px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 4px; }

        /* ផ្នែកស្ថានភាព (Status Area) */
        #ios-status-container {
            margin-top: 10px;
            min-height: 50px;
        }

        #status { 
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px; 
            border-radius: 14px; 
            font-size: 15px;
            font-weight: 500;
            display: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .success { background-color: rgba(52, 199, 89, 0.1); color: var(--ios-success); border: 1px solid rgba(52, 199, 89, 0.2); }
        .error { background-color: rgba(255, 59, 48, 0.1); color: var(--ios-error); border: 1px solid rgba(255, 59, 48, 0.2); }
        .loading { background-color: rgba(0, 122, 255, 0.08); color: var(--ios-primary); border: 1px solid rgba(0, 122, 255, 0.15); }

    </style>
</head>
<body>

<div class="ios-container">
    <div class="ios-header">
        <h2>ចុះវត្តមាន QR Code</h2>
        <div class="ios-subtitle">សូមស្កេន QR Code ក្នុងហាង</div>
    </div>
    
    <div class="ios-group">
        <label for="userName">ឈ្មោះ ឬ ID បុគ្គលិក</label>
        <input type="text" id="userName" placeholder="ឧ. លីកា">
    </div>

    <div class="ios-action-group">
        <div class="ios-action-option">
            <input type="radio" name="actionType" value="Check-In" id="checkin" checked>
            <label for="checkin">
                <span class="ios-icon">👍</span> <!-- SF Symbol: ThumbUp -->
                ចូល (Check-In)
            </label>
        </div>
        <div class="ios-action-option">
            <input type="radio" name="actionType" value="Check-Out" id="checkout">
            <label for="checkout">
                <span class="ios-icon">🏠</span> <!-- SF Symbol: Home -->
                ចេញ (Check-Out)
            </label>
        </div>
    </div>

    <div class="ios-group" style="padding: 10px;">
        <label>កាមេរ៉ាស្កេន</label>
        <div id="ios-reader-container">
            <div class="ios-qr-focus-box">
                <div class="ios-focus-corner top-left"></div>
                <div class="ios-focus-corner top-right"></div>
                <div class="ios-focus-corner bottom-left"></div>
                <div class="ios-focus-corner bottom-right"></div>
            </div>
            <div id="reader"></div>
        </div>
    </div>

    <div id="ios-status-container">
        <div id="status">
            <span id="status-icon">🔄</span>
            <span id="status-text"></span>
        </div>
    </div>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        
        statusDiv.style.display = 'flex';
        statusText.innerText = msg;
        statusDiv.className = type; // success, error, loading

        if (type === 'success') { statusIcon.innerText = '✅'; }
        else if (type === 'error') { statusIcon.innerText = '❌'; }
        else if (type === 'loading') { statusIcon.innerText = '🔄'; }
    }

    function sendCheckin(userName, lat, lng, actionType, qrData) {
        showStatus("កំពុងផ្ទៀងផ្ទាត់ទិន្នន័យ...", 'loading');
        
        fetch('/api/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userName: userName,
                userLat: lat,
                userLng: lng,
                actionType: actionType,
                qrCodeData: qrData
            })
        })
        .then(res => res.json())
        .then(data => {
            showStatus(data.message, data.success ? 'success' : 'error');
        })
        .catch(err => {
            showStatus("មានបញ្ហាតភ្ជាប់ទៅកាន់ Server!", 'error');
        });
    }

    // ចាប់ផ្តើមស្កេន
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        (decodedText) => {
            const userName = document.getElementById('userName').value;
            const actionType = document.querySelector('input[name="actionType"]:checked').value;

            if (!userName || userName.trim() === "") {
                showStatus("សូមវាយឈ្មោះរបស់អ្នកមុននឹងស្កេន!", 'error');
                return;
            }

            // សុំសិទ្ធិបើក GPS
            navigator.geolocation.getCurrentPosition((pos) => {
                sendCheckin(userName, pos.coords.latitude, pos.coords.longitude, actionType, decodedText);
            }, (err) => {
                showStatus("សូមបើក GPS/Location លើទូរស័ព្ទរបស់អ្នក!", 'error');
            });
        },
        () => { /* កុំធ្វើអ្វីពេលកំពុងស្វែងរក QR */ }
    );
</script>

</body>
</html>
