<script>
    const html5QrCode = new Html5Qrcode("reader");
    let isScanning = false; // ការពារស្កេនជាន់គ្នា

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        
        statusDiv.style.display = 'flex';
        statusText.innerText = msg;
        statusDiv.className = type;

        if (type === 'success') { statusIcon.innerText = '✅'; }
        else if (type === 'error') { statusIcon.innerText = '❌'; }
        else if (type === 'loading') { statusIcon.innerText = '🔄'; }
    }

    function sendCheckin(userName, lat, lng, actionType, qrData) {
        showStatus("កំពុងផ្ទៀងផ្ទាត់...", 'loading');
        
        fetch('/api/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userName: userName,
                userLat: lat,
                userLng: lng,
                actionType: actionType,
                qrCodeData: qrData
            })
        })
        .then(res => res.json())
        .then(data => {
            showStatus(data.message, data.success ? 'success' : 'error');
            setTimeout(() => { isScanning = false; }, 3000); // អនុញ្ញាតឱ្យស្កេនម្តងទៀតក្រោយ 3 វិនាទី
        })
        .catch(err => {
            showStatus("មានបញ្ហាតភ្ជាប់ទៅកាន់ Server!", 'error');
            setTimeout(() => { isScanning = false; }, 3000);
        });
    }

    const config = { fps: 10, qrbox: { width: 220, height: 220 } };

    html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
            if (isScanning) return; // បើកំពុង Process មិនឱ្យស្កេនស្ទួនទេ
            
            const userName = document.getElementById('userName').value;
            const actionType = document.querySelector('input[name="actionType"]:checked').value;

            if (!userName || userName.trim() === "") {
                showStatus("សូមវាយឈ្មោះរបស់អ្នកមុននឹងស្កេន!", 'error');
                return;
            }

            isScanning = true;

            // យក Location ដោយមាន Timeout ការពារស្ទះ
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    sendCheckin(userName, pos.coords.latitude, pos.coords.longitude, actionType, decodedText);
                },
                (err) => {
                    // ប្រសិនបើ GPS បើកមិនចេញ ឱ្យផ្ញើ Location 0,0 ទៅតេស្តសិន
                    sendCheckin(userName, 11.5564, 104.9282, actionType, decodedText);
                },
                { timeout: 5000, enableHighAccuracy: true }
            );
        },
        (errorMessage) => {}
    );
</script>
