<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធស្កេនវត្តមានទំនើប</title>
    
    <!-- Link ទៅហ្វុងខ្មែរ Kantumruy Pro ដើម្បីឱ្យអក្សរស្អាត -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Link ទៅ Library ស្កេន QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root {
            --primary: #3b82f6; /* ពណ៌ខៀវ */
            --success: #10b981; /* ពណ៌បៃតង */
            --error: #ef4444;   /* ពណ៌ក្រហម */
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --text: #1f2937;
        }

        body { 
            font-family: 'Kantumruy Pro', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: var(--bg-gradient); 
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        .glass-card { 
            background: var(--glass-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        h2 { 
            font-weight: 600; 
            font-size: 24px; 
            margin-top: 0; 
            margin-bottom: 20px; 
            color: #111827; 
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4b5563;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            border: 1.5px solid rgba(0,0,0,0.1); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-family: 'Kantumruy Pro', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .action-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-option {
            flex: 1;
            position: relative;
        }

        .action-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .action-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1.5px solid rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            text-align: center;
            font-size: 13px;
        }

        .icon-check {
            font-size: 22px;
            margin-bottom: 5px;
            color: #9ca3af;
        }

        /* ស្ទីលពេលជ្រើសរើស */
        .action-option input[type="radio"]:checked + label {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.08);
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.15);
        }
        
        .action-option input[type="radio"]:checked + label .icon-check {
            color: var(--primary);
        }

        #reader-container {
            width: 100%;
            margin-top: 10px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background-color: #f9fafb;
            border: 1.5px solid rgba(0,0,0,0.08);
        }

        #reader { 
            width: 100%; 
        }

        /* បន្ថែមស្ទីលជ្រុងៗលើកញ្ចក់ស្កេន (ដូចរូបភាពក្នុងសំណួរ) */
        .qr-focus-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 10;
        }

        .focus-corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: white; /* ពណ៌ស */
            border-style: solid;
        }

        .top-left { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 4px; }
        .top-right { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 4px; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 4px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 4px; }

        #status-container {
            margin-top: 20px;
            min-height: 40px;
        }

        #status { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px; 
            border-radius: 10px; 
            font-size: 14px;
            font-weight: 500;
            display: none; /* លាក់ជាមុនសិន */
        }

        .success { background-color: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .error { background-color: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.2); }
        .loading { background-color: rgba(59, 130, 246, 0.08); color: var(--primary); border: 1px solid rgba(59, 130, 246, 0.15); }

    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2>ស្កេនវត្តមានធ្វើការ</h2>
        
        <div class="input-group">
            <label for="userName">ឈ្មោះ ឬ ID បុគ្គលិក៖</label>
            <input type="text" id="userName" placeholder="ឧទាហរណ៍៖ ស្រីរ៉ា">
        </div>

        <div class="input-group">
            <label>សូមជ្រើសរើសសកម្មភាព៖</label>
            <div class="action-group">
                <div class="action-option">
                    <input type="radio" name="actionType" value="Check-In" id="checkin" checked>
                    <label for="checkin">
                        <span class="icon-check">👇</span>
                        ចូល (Check-In)
                    </label>
                </div>
                <div class="action-option">
                    <input type="radio" name="actionType" value="Check-Out" id="checkout">
                    <label for="checkout">
                        <span class="icon-check">🚪</span>
                        ចេញ (Check-Out)
                    </label>
                </div>
            </div>
        </div>

        <div id="reader-container">
            <!-- ជ្រុងៗលើកញ្ចក់ស្កេន -->
            <div class="qr-focus-box">
                <div class="focus-corner top-left"></div>
                <div class="focus-corner top-right"></div>
                <div class="focus-corner bottom-left"></div>
                <div class="focus-corner bottom-right"></div>
            </div>
            <!-- កញ្ចក់ស្កេន QR -->
            <div id="reader"></div>
        </div>

        <div id="status-container">
            <div id="status">
                <span id="status-icon">🔄</span>
                <span id="status-text"></span>
            </div>
        </div>
    </div>
</div>

<script>
    const html5QrCode = new Html5Qrcode("reader");

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        
        statusDiv.style.display = 'flex';
        statusText.innerText = msg;
        statusDiv.className = type; // success, error, loading

        if (type === 'success') { statusIcon.innerText = '✅'; }
        else if (type === 'error') { statusIcon.innerText = '❌'; }
        else if (type === 'loading') { statusIcon.innerText = '🔄'; }
    }

    function sendCheckin(userName, lat, lng, actionType, qrData) {
        showStatus("កំពុងផ្ទៀងផ្ទាត់ទិន្នន័យ...", 'loading');
        
        fetch('/api/checkin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userName: userName,
                userLat: lat,
                userLng: lng,
                actionType: actionType,
                qrCodeData: qrData
            })
        })
        .then(res => res.json())
        .then(data => {
            showStatus(data.message, data.success ? 'success' : 'error');
        })
        .catch(err => {
            showStatus("មានបញ្ហាតភ្ជាប់ទៅកាន់ Server!", 'error');
        });
    }

    // ចាប់ផ្តើមស្កេន
    html5QrCode.start(
        { facingMode: "environment" }, // ប្រើកាមេរ៉ាក្រោយ
        { fps: 10, qrbox: { width: 200, height: 200 } }, // ទំហំស្កេន
        (decodedText) => {
            const userName = document.getElementById('userName').value;
            const actionType = document.querySelector('input[name="actionType"]:checked').value;

            if (!userName || userName.trim() === "") {
                showStatus("សូមវាយឈ្មោះរបស់អ្នកមុននឹងស្កេន!", 'error');
                return;
            }

            // សុំសិទ្ធិបើក GPS
            navigator.geolocation.getCurrentPosition((pos) => {
                sendCheckin(userName, pos.coords.latitude, pos.coords.longitude, actionType, decodedText);
            }, (err) => {
                showStatus("សូមបើក GPS/Location លើទូរស័ព្ទរបស់អ្នក!", 'error');
            });
        },
        () => { /* កុំធ្វើអ្វីពេលកំពុងស្វែងរក QR */ }
    );
</script>

</body>
</html>
