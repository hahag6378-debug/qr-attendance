<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រព័ន្ធ - QR Attendance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Khmer Font -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Kantumruy Pro', sans-serif; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.08); }
        }
        .animate-pulse-bg { animation: pulse-slow 7s ease-in-out infinite; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-orange-500 selection:text-black">

    <div class="absolute -top-32 -left-32 w-96 h-96 bg-orange-500/20 rounded-full blur-[120px] pointer-events-none animate-pulse-bg"></div>
    <div class="absolute top-1/2 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-[140px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-zinc-900/90 rounded-3xl border border-zinc-800/80 p-8 shadow-2xl backdrop-blur-xl relative z-10">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl text-zinc-950 font-bold text-2xl shadow-lg shadow-orange-500/20 mb-4">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">ចូលប្រព័ន្ធវត្តមាន</h1>
            <p class="text-xs text-zinc-400 mt-1 uppercase tracking-widest">QR Attendance System</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-2">ឈ្មោះគណនី (Username)</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-3.5 text-zinc-500 text-sm"></i>
                    <input type="text" id="username" required placeholder="បញ្ចូលឈ្មោះគណនី..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-11 pr-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-orange-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-2">ពាក្យសម្ងាត់ (Password)</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-4 top-3.5 text-zinc-500 text-sm"></i>
                    <input type="password" id="password" required placeholder="បញ្ចូលពាក្យសម្ងាត់..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-11 pr-11 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-orange-500 transition-all">
                    <!-- ប៊ូតុងបិទបើកមើលពាក្យសម្ងាត់ (Show/Hide Password) -->
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-3.5 text-zinc-500 hover:text-orange-400 transition-colors text-sm focus:outline-none cursor-pointer">
                        <i id="toggleIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Error Box -->
            <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3 text-center">
                <span id="errorMessage" class="text-xs text-red-400 font-medium"></span>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-zinc-950 font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-500/20 transition-all flex items-center justify-center space-x-2 cursor-pointer">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span id="btnText">LOGIN ចូលប្រព័ន្ធ</span>
            </button>
        </form>
    </div>

    <script>
        // 👁️ Function បិទបើកមើលពាក្យសម្ងាត់
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.innerText = "កំពុងភ្ជាប់ទៅកាន់ Server...";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    if (data.user.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    showError(data.message || 'ឈ្មោះគណនី ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ!');
                }
            } catch (err) {
                showError('មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ! (Server អាចកំពុង Boot សូមរង់ចាំ ២០ វិនាទី រួចសាកល្បងម្ដងទៀត)');
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = "LOGIN ចូលប្រព័ន្ធ";
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.innerText = msg;
            errorBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
