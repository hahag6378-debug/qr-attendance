<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Attendance System</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23F16522' d='M403.75,289.1c-12.38-12.39-19.18-28.47-19.15-45.27c0.05-31.64,24.14-58.48,55.25-63.39c-10.47-30.2-27.76-57.4-51.84-81.59C345.37,56.02,293.31,34.6,231.84,34.6c-61.29,0-113.26,21.42-155.9,64.24c-42.64,42.83-63.95,95.08-63.95,156.73c0,61.85,21.32,114.29,63.95,157.29c42.64,43.02,94.61,64.52,155.9,64.52c61.47,0,113.53-21.5,156.17-64.52c29.93-30.18,49.35-65.01,58.28-104.48C430.61,307.56,415.26,300.63,403.75,289.1z M262.48,276.24c-8.06,8.54-18.28,12.8-30.64,12.8c-12.19,0-22.31-4.26-30.37-12.8c-8.06-8.52-12.09-19.26-12.09-32.18c0-12.94,4.03-23.66,12.09-32.19c8.06-8.53,18.18-12.79,30.37-12.79c12.37,0,22.58,4.26,30.64,12.79c8.06,8.53,12.08,19.26,12.08,32.19C274.56,256.98,270.54,267.72,262.48,276.24z'/><path fill='%23F16522' d='M500.01,244.2c-0.18,25.42-19.36,46.64-43.9,49.93c-1.98,0.27-3.99,0.41-6.04,0.44c-0.37,0-0.76,0-1.13-0.01c-27.1-0.31-50.48-23.67-50.44-50.71c0.04-25.23,20.24-46.92,45.51-49.96c1.57-0.19,3.16-0.3,4.76-0.34c1.07-0.03,2.14-0.02,3.19,0.03C478.5,194.61,500.19,217.1,500.01,244.2z'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif !important; }
        body { margin: 0; padding: 0; background-color: #F8FAFC; color: #0F172A; }
        
        header { 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #E2E8F0;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 44px; height: 44px; flex-shrink: 0; }
        .brand-text h1 { margin: 0; font-size: 18px; font-weight: 700; color: #0F172A; }
        .brand-text p { margin: 2px 0 0 0; font-size: 12px; color: #64748B; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 16px; border: 1px solid #E2E8F0; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); padding: 24px; margin-bottom: 24px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: white; border-radius: 14px; border: 1px solid #E2E8F0; padding: 18px; display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-excel { background: #10B981; color: white; }
        .btn-pdf { background: #EF4444; color: white; }
        .btn-orange { background: #F16522; color: white; }
        .btn-logout { background: #F1F5F9; color: #64748B; border: 1px solid #CBD5E1; }

        input, select { padding: 10px 14px; border-radius: 8px; border: 1px solid #CBD5E1; outline: none; font-size: 14px; }
        input:focus, select:focus { border-color: #F16522; }

        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: #F8FAFC; color: #475569; font-weight: 600; font-size: 13px; padding: 12px 16px; text-align: left; border-bottom: 2px solid #E2E8F0; }
        td { padding: 12px 16px; border-bottom: 1px solid #F1F5F9; font-size: 14px; color: #334155; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .badge-in { background: #DCFCE7; color: #166534; }
        .badge-late { background: #FEE2E2; color: #991B1B; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <svg class="logo-svg" viewBox="0 0 512 512" fill="none">
            <path fill="#F16522" d="M403.75,289.1c-12.38-12.39-19.18-28.47-19.15-45.27c0.05-31.64,24.14-58.48,55.25-63.39c-10.47-30.2-27.76-57.4-51.84-81.59C345.37,56.02,293.31,34.6,231.84,34.6c-61.29,0-113.26,21.42-155.9,64.24c-42.64,42.83-63.95,95.08-63.95,156.73c0,61.85,21.32,114.29,63.95,157.29c42.64,43.02,94.61,64.52,155.9,64.52c61.47,0,113.53-21.5,156.17-64.52c29.93-30.18,49.35-65.01,58.28-104.48C430.61,307.56,415.26,300.63,403.75,289.1z M262.48,276.24c-8.06,8.54-18.28,12.8-30.64,12.8c-12.19,0-22.31-4.26-30.37-12.8c-8.06-8.52-12.09-19.26-12.09-32.18c0-12.94,4.03-23.66,12.09-32.19c8.06-8.53,18.18-12.79,30.37-12.79c12.37,0,22.58,4.26,30.64,12.79c8.06,8.53,12.08,19.26,12.08,32.19C274.56,256.98,270.54,267.72,262.48,276.24z"/>
            <path fill="#F16522" d="M500.01,244.2c-0.18,25.42-19.36,46.64-43.9,49.93c-1.98,0.27-3.99,0.41-6.04,0.44c-0.37,0-0.76,0-1.13-0.01c-27.1-0.31-50.48-23.67-50.44-50.71c0.04-25.23,20.24-46.92,45.51-49.96c1.57-0.19,3.16-0.3,4.76-0.34c1.07-0.03,2.14-0.02,3.19,0.03C478.5,194.61,500.19,217.1,500.01,244.2z"/>
        </svg>
        <div class="brand-text">
            <h1>ATTENDANCE ADMIN</h1>
            <p>ប្រព័ន្ធគ្រប់គ្រងវត្តមានបុគ្គលិក</p>
        </div>
    </div>
    <div id="header-logout" style="display: none;">
        <button onclick="logout()" class="btn btn-logout"><i data-lucide="log-out"></i> ចាកចេញ</button>
    </div>
</header>

<div class="container">
    <div id="login-section" class="card" style="max-width: 380px; margin: 80px auto; text-align: center;">
        <h2>🔐 ចូលប្រព័ន្ធ Admin</h2>
        <input type="password" id="adminPass" placeholder="បញ្ចូល Password..." style="width:100%; margin:15px 0;">
        <button onclick="loginAdmin()" class="btn btn-orange" style="width:100%; justify-content:center;">Login</button>
    </div>

    <div id="dashboard-section" style="display: none;">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background:#DBEAFE; color:#1D4ED8;"><i data-lucide="users"></i></div>
                <div><h3 id="stat-total" style="margin:0;">0</h3><p style="margin:0; font-size:12px; color:#64748B;">វត្តមានសរុបថ្ងៃនេះ</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#DCFCE7; color:#15803D;"><i data-lucide="clock"></i></div>
                <div><h3 id="stat-ontime" style="margin:0;">0</h3><p style="margin:0; font-size:12px; color:#64748B;">មកទាន់ពេល</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background:#FEE2E2; color:#B91C1C;"><i data-lucide="alert-triangle"></i></div>
                <div><h3 id="stat-late" style="margin:0;">0</h3><p style="margin:0; font-size:12px; color:#64748B;">មកយឺត</p></div>
            </div>
        </div>

        <div class="grid-2">
            <div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:15px;">
                        <h3 style="margin:0;">📋 របាយការណ៍វត្តមាន</h3>
                        <div>
                            <button onclick="exportExcel()" class="btn btn-excel"><i data-lucide="file-spreadsheet"></i> Excel</button>
                            <button onclick="downloadPDF()" class="btn btn-pdf"><i data-lucide="file-text"></i> PDF</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID/ឈ្មោះ</th>
                                    <th>សកម្មភាព</th>
                                    <th>ចម្ងាយ</th>
                                    <th>កាលបរិច្ឆេទ</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div>
                <!-- ⚙️ ផ្ទាំងកំណត់រចនាសម្ព័ន្ធប្រព័ន្ធ (Fixed Settings មិនបាត់ពេល Refresh) -->
                <div class="card">
                    <h3 style="margin-top:0;">⚙️ កំណត់រចនាសម្ព័ន្ធប្រព័ន្ធ</h3>
                    
                    <label style="font-size:12px; font-weight:600;">⏰ ម៉ោងចូលធ្វើការ (Shift Start):</label>
                    <input type="time" id="shiftTime" value="08:00" style="width:100%; margin-bottom:10px;">

                    <label style="font-size:12px; font-weight:600;">📍 កាំចម្ងាយ GPS Radius (ម៉ែត្រ):</label>
                    <input type="number" id="gpsRadius" value="50" style="width:100%; margin-bottom:10px;">

                    <label style="font-size:12px; font-weight:600;">🤖 Telegram Bot Token:</label>
                    <input type="password" id="tgToken" placeholder="Bot Token..." style="width:100%; margin-bottom:10px;">

                    <label style="font-size:12px; font-weight:600;">📢 Telegram Chat ID:</label>
                    <input type="text" id="tgChatId" placeholder="-100xxx..." style="width:100%; margin-bottom:15px;">

                    <button onclick="saveSettings()" class="btn btn-orange" style="width:100%; justify-content:center;">
                        <i data-lucide="save"></i> រក្សាទុកការកំណត់
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    const ADMIN_PASSWORD = "admin123456";
    let originalData = [];

    window.onload = function() {
        loadSettings();
    };

    function loginAdmin() {
        if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('header-logout').style.display = 'block';
            loadData();
            loadSettings();
        } else alert("Password មិនត្រឹមត្រូវ!");
    }

    function logout() { location.reload(); }

    function saveSettings() {
        localStorage.setItem('config_shift', document.getElementById('shiftTime').value);
        localStorage.setItem('config_radius', document.getElementById('gpsRadius').value);
        localStorage.setItem('config_tgToken', document.getElementById('tgToken').value);
        localStorage.setItem('config_tgChatId', document.getElementById('tgChatId').value);
        alert("រក្សាទុកការកំណត់ជោគជ័យ! ទិន្នន័យនឹងមិនបាត់បង់ទេពេល Refresh។");
    }

    function loadSettings() {
        if(localStorage.getItem('config_shift')) document.getElementById('shiftTime').value = localStorage.getItem('config_shift');
        if(localStorage.getItem('config_radius')) document.getElementById('gpsRadius').value = localStorage.getItem('config_radius');
        if(localStorage.getItem('config_tgToken')) document.getElementById('tgToken').value = localStorage.getItem('config_tgToken');
        if(localStorage.getItem('config_tgChatId')) document.getElementById('tgChatId').value = localStorage.getItem('config_tgChatId');
    }

    function loadData() {
        fetch('/api/export-data')
            .then(res => res.json())
            .then(data => {
                originalData = data;
                renderTable(data);
                document.getElementById('stat-total').innerText = data.length;
            });
    }

    function renderTable(data) {
        const tbody = document.getElementById('attendanceTable');
        tbody.innerHTML = '';
        data.forEach(item => {
            const isCheckIn = item.actionType === 'Check-In';
            tbody.innerHTML += `<tr>
                <td><b>${item.userName}</b></td>
                <td><span class="badge ${isCheckIn ? 'badge-in' : 'badge-late'}">${item.actionType}</span></td>
                <td>${item.distance}m</td>
                <td style="font-size:12px; color:#64748B;">${item.timestamp}</td>
            </tr>`;
        });
    }
</script>
</body>
</html>
