<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Attendance System</title>
    <!-- បន្ថែមបន្ទាត់នេះនៅក្នុងផ្នែក <head> -->

    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Libraries សម្រាប់ Export PDF & Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif !important; }
        body { margin: 0; padding: 0; background-color: #F8FAFC; color: #0F172A; }
        
        /* Glassmorphism Header */
        header { 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #E2E8F0;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 44px; height: 44px; flex-shrink: 0; }
        .brand-text h1 { margin: 0; font-size: 18px; font-weight: 700; color: #0F172A; line-height: 1.2; }
        .brand-text p { margin: 2px 0 0 0; font-size: 12px; color: #64748B; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        /* Modern Cards */
        .card { 
            background: white; 
            border-radius: 16px; 
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 24px; 
        }

        /* Action Bar */
        .action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .btn-group { display: flex; gap: 10px; }
        
        .btn { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            padding: 10px 18px; 
            border-radius: 10px; 
            border: none; 
            font-weight: 600; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.9; }

        .btn-excel { background: #10B981; color: white; }
        .btn-pdf { background: #EF4444; color: white; }
        .btn-orange { background: #F16522; color: white; }
        .btn-logout { background: #F1F5F9; color: #64748B; border: 1px solid #CBD5E1; }
        .btn-logout:hover { background: #E2E8F0; color: #0F172A; }

        /* Login Screen */
        .login-box { max-width: 380px; margin: 80px auto; text-align: center; }
        .input-group { margin: 18px 0; text-align: left; }
        .input-group label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
        input[type="password"] { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 10px; 
            border: 1px solid #CBD5E1; 
            outline: none; 
            font-size: 15px;
            transition: border 0.2s;
        }
        input[type="password"]:focus { border-color: #F16522; }

        /* Modern Table */
        .table-responsive { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { 
            background: #F8FAFC; 
            color: #475569; 
            font-weight: 600; 
            font-size: 13px; 
            padding: 14px 16px; 
            text-align: left; 
            border-bottom: 2px solid #E2E8F0; 
        }
        td { padding: 14px 16px; border-bottom: 1px solid #F1F5F9; font-size: 14px; color: #334155; }
        tr:last-child td { border-bottom: none; }
        
        .badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
        }
        .badge-in { background: #DCFCE7; color: #166534; }
        .badge-out { background: #FEF3C7; color: #92400E; }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <!-- SVG Logo ផ្លូវការរបស់បង -->
        <svg class="logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill="#F16522" d="M403.75,289.1c-12.38-12.39-19.18-28.47-19.15-45.27c0.05-31.64,24.14-58.48,55.25-63.39
                c-10.47-30.2-27.76-57.4-51.84-81.59C345.37,56.02,293.31,34.6,231.84,34.6c-61.29,0-113.26,21.42-155.9,64.24
                c-42.64,42.83-63.95,95.08-63.95,156.73c0,61.85,21.32,114.29,63.95,157.29c42.64,43.02,94.61,64.52,155.9,64.52
                c61.47,0,113.53-21.5,156.17-64.52c29.93-30.18,49.35-65.01,58.28-104.48C430.61,307.56,415.26,300.63,403.75,289.1z
                M262.48,276.24c-8.06,8.54-18.28,12.8-30.64,12.8c-12.19,0-22.31-4.26-30.37-12.8c-8.06-8.52-12.09-19.26-12.09-32.18
                c0-12.94,4.03-23.66,12.09-32.19c8.06-8.53,18.18-12.79,30.37-12.79c12.37,0,22.58,4.26,30.64,12.79
                c8.06,8.53,12.08,19.26,12.08,32.19C274.56,256.98,270.54,267.72,262.48,276.24z"/>
            <path fill="#F16522" d="M500.01,244.2c-0.18,25.42-19.36,46.64-43.9,49.93c-1.98,0.27-3.99,0.41-6.04,0.44c-0.37,0-0.76,0-1.13-0.01
                c-27.1-0.31-50.48-23.67-50.44-50.71c0.04-25.23,20.24-46.92,45.51-49.96c1.57-0.19,3.16-0.3,4.76-0.34
                c1.07-0.03,2.14-0.02,3.19,0.03C478.5,194.61,500.19,217.1,500.01,244.2z"/>
        </svg>
        <div class="brand-text">
            <h1>ATTENDANCE ADMIN</h1>
            <p>ប្រព័ន្ធគ្រប់គ្រងវត្តមានបុគ្គលិក</p>
        </div>
    </div>
    <div id="header-logout" style="display: none;">
        <button onclick="logout()" class="btn btn-logout"><i data-lucide="log-out"></i> ចាកចេញ</button>
    </div>
</header>

<div class="container">
    <!-- 🔐 ផ្ទាំង Login Admin -->
    <div id="login-section" class="card login-box">
        <svg class="logo-svg" style="width: 70px; height: 70px; margin-bottom: 12px;" viewBox="0 0 512 512" fill="none">
            <path fill="#F16522" d="M403.75,289.1c-12.38-12.39-19.18-28.47-19.15-45.27c0.05-31.64,24.14-58.48,55.25-63.39
                c-10.47-30.2-27.76-57.4-51.84-81.59C345.37,56.02,293.31,34.6,231.84,34.6c-61.29,0-113.26,21.42-155.9,64.24
                c-42.64,42.83-63.95,95.08-63.95,156.73c0,61.85,21.32,114.29,63.95,157.29c42.64,43.02,94.61,64.52,155.9,64.52
                c61.47,0,113.53-21.5,156.17-64.52c29.93-30.18,49.35-65.01,58.28-104.48C430.61,307.56,415.26,300.63,403.75,289.1z
                M262.48,276.24c-8.06,8.54-18.28,12.8-30.64,12.8c-12.19,0-22.31-4.26-30.37-12.8c-8.06-8.52-12.09-19.26-12.09-32.18
                c0-12.94,4.03-23.66,12.09-32.19c8.06-8.53,18.18-12.79,30.37-12.79c12.37,0,22.58,4.26,30.64,12.79
                c8.06,8.53,12.08,19.26,12.08,32.19C274.56,256.98,270.54,267.72,262.48,276.24z"/>
            <path fill="#F16522" d="M500.01,244.2c-0.18,25.42-19.36,46.64-43.9,49.93c-1.98,0.27-3.99,0.41-6.04,0.44c-0.37,0-0.76,0-1.13-0.01
                c-27.1-0.31-50.48-23.67-50.44-50.71c0.04-25.23,20.24-46.92,45.51-49.96c1.57-0.19,3.16-0.3,4.76-0.34
                c1.07-0.03,2.14-0.02,3.19,0.03C478.5,194.61,500.19,217.1,500.01,244.2z"/>
        </svg>
        <h2 style="margin: 0 0 6px 0;">ចូលប្រព័ន្ធ Admin</h2>
        <p style="color: #64748B; margin: 0; font-size: 14px;">សូមវាយបញ្ចូលលេខកូដសម្ងាត់</p>

        <div class="input-group">
            <label>លេខកូដសម្ងាត់ (Password)</label>
            <input type="password" id="adminPass" placeholder="បញ្ចូល Password..." onkeyup="if(event.key === 'Enter') loginAdmin()">
        </div>
        <button onclick="loginAdmin()" class="btn btn-orange" style="width: 100%; justify-content: center; padding: 12px;">
            <i data-lucide="lock"></i> ចូលប្រើប្រាស់
        </button>
        <p id="loginErr" style="color: #EF4444; display: none; margin-top: 12px; font-size: 13px;">❌ Password មិនត្រឹមត្រូវ!</p>
    </div>

    <!-- 📊 ផ្ទាំង Dashboard -->
    <div id="dashboard-section" style="display: none;">
        <div class="card action-bar">
            <div>
                <h2 style="margin: 0; font-size: 20px;">របាយការណ៍វត្តមានបុគ្គលិក</h2>
                <p style="margin: 4px 0 0 0; color: #64748B; font-size: 13px;">ទិន្នន័យស្កេន Check-in/out ទាំងអស់ក្នុងប្រព័ន្ធ</p>
            </div>
            <div class="btn-group">
                <button onclick="exportExcel()" class="btn btn-excel">
                    <i data-lucide="file-spreadsheet"></i> Export Excel
                </button>
                <button onclick="downloadPDF()" class="btn btn-pdf">
                    <i data-lucide="file-text"></i> Export PDF
                </button>
            </div>
        </div>

        <div class="card" style="padding: 12px 24px;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>ឈ្មោះ / ID បុគ្គលិក</th>
                            <th>សកម្មភាព</th>
                            <th>ចម្ងាយ (ម៉ែត្រ)</th>
                            <th>កាលបរិច្ឆេទ & ពេលវេលា</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTable">
                        <tr><td colspan="5" style="text-align:center;">កំពុងទាញយកទិន្នន័យ...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();
    const ADMIN_PASSWORD = "admin123456";
    let globalAttendanceData = [];

    function loginAdmin() {
        const inputPass = document.getElementById('adminPass').value;
        if (inputPass === ADMIN_PASSWORD) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('header-logout').style.display = 'block';
            loadAttendance();
        } else {
            document.getElementById('loginErr').style.display = 'block';
        }
    }

    function logout() {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('header-logout').style.display = 'none';
        document.getElementById('adminPass').value = '';
    }

    function loadAttendance() {
        fetch('/api/export-data')
            .then(res => res.json())
            .then(data => {
                globalAttendanceData = data;
                const tbody = document.getElementById('attendanceTable');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94A3B8; padding:30px;">មិនទាន់មានទិន្នន័យស្កេននៅឡើយទេ</td></tr>';
                    return;
                }

                data.forEach(item => {
                    const isCheckIn = item.actionType === 'Check-In';
                    const badgeClass = isCheckIn ? 'badge-in' : 'badge-out';
                    const iconName = isCheckIn ? 'log-in' : 'log-out';

                    const row = `<tr>
                        <td><b>#${item.id}</b></td>
                        <td><b>${item.userName}</b></td>
                        <td>
                            <span class="badge ${badgeClass}">
                                <i data-lucide="${iconName}" style="width:14px; height:14px;"></i> ${item.actionType}
                            </span>
                        </td>
                        <td>${item.distance}</td>
                        <td style="color:#64748B;">${item.timestamp}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                lucide.createIcons();
            });
    }

    // 🟢 Export Excel Function
    function exportExcel() {
        if (globalAttendanceData.length === 0) return alert("គ្មានទិន្នន័យសម្រាប់ Export ទេ!");
        
        const formattedData = globalAttendanceData.map(item => ({
            "ID": item.id,
            "ឈ្មោះបុគ្គលិក": item.userName,
            "សកម្មភាព": item.actionType,
            "ចម្ងាយ (ម៉ែត្រ)": item.distance,
            "កាលបរិច្ឆេទ & ពេលវេលា": item.timestamp
        }));

        const worksheet = XLSX.utils.json_to_sheet(formattedData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Attendance");
        XLSX.writeFile(workbook, `Attendance_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // 🔴 Export PDF Function
    function downloadPDF() {
        if (globalAttendanceData.length === 0) return alert("គ្មានទិន្នន័យសម្រាប់ Export ទេ!");

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16);
        doc.text("Attendance Summary Report", 14, 15);
        
        const tableColumn = ["ID", "Name / ID", "Action", "Distance", "Date Time"];
        const tableRows = globalAttendanceData.map(item => [item.id, item.userName, item.actionType, item.distance, item.timestamp]);

        doc.autoTable({
            head: [tableColumn],
            body: tableRows,
            startY: 25,
            theme: 'grid',
            headStyles: { fillColor: [241, 101, 34] }
        });

        doc.save(`Attendance_Report_${new Date().toISOString().slice(0,10)}.pdf`);
    }
</script>

</body>
</html>
